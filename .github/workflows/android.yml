name: Android

on:
  push:
    tags:
      - 'O*'
      - 'o*'
  workflow_dispatch:
    inputs:
      release_number:
        description: 'Release number (the N in tag ON; 0 = dev build)'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Universal APK (4 ABIs)
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Check out with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk/ndk \
            /usr/local/lib/android/sdk/system-images
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK, NDK, CMake and host tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"
          sudo apt-get update -qq
          sudo apt-get install -y -qq nasm

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', 'buildSrc/**') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          mkdir -p TMessagesProj/config
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > TMessagesProj/config/release.keystore
          test -s TMessagesProj/config/release.keystore

      - name: Point Gradle at the SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Resolve release number
        id: rel
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ "$tag" =~ ^[Oo]([0-9]+)$ ]]; then
            number="${BASH_REMATCH[1]}"
          else
            number="${{ inputs.release_number }}"
            [[ "$number" =~ ^[0-9]+$ ]] || number=0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "name=vibe-O${number}-universal.apk" >> "$GITHUB_OUTPUT"
          echo "Release number: $number"

      - name: Build standalone APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone \
            -POWPENGRAM_BUILD="${{ steps.rel.outputs.number }}" \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD" \
            --no-daemon \
            --stacktrace

      - name: Collect and verify APK
        id: apk
        run: |
          set -euo pipefail
          src=TMessagesProj_AppStandalone/build/outputs/apk/afat/standalone/app.apk
          test -f "$src"
          cp "$src" "${{ steps.rel.outputs.name }}"
          ls -lh "${{ steps.rel.outputs.name }}"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --print-certs "${{ steps.rel.outputs.name }}"
          echo "path=${{ steps.rel.outputs.name }}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ steps.rel.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          apk="${{ steps.apk.outputs.path }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" "$apk" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$apk" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Vibe $tag" \
              --generate-notes
          fi
